<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Flight Booking (Simplified)</title>
    <style>
        /* Styles omitted for brevity */
        body {
        font-family: sans-serif;
        margin: 0;
        background-color: #f0f0f0;
        }
        .container {
        width: 90%;
        max-width: 600px;
        margin: 30px auto;
        padding: 20px;
        background-color: white;
        border: 1px solid #ccc;
        position: relative;
        padding-bottom: 40px;
        }
        .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        }
        .auth-buttons {
        display: flex;
        align-items: center;
        }
        .auth-buttons a {
        margin-left: 10px;
        text-decoration: none;
        color: #007bff;
        }
        #language-select-container {
        position: absolute;
        bottom: 10px;
        left: 20px;
        z-index: 10;
        font-size: 0.9em;
        }
        .lang-option {
        text-decoration: none;
        color: #666;
        margin: 0 2px;
        padding: 2px;
        cursor: pointer;
        transition: color 0.1s ease;
        }
        .lang-option.active {
        color: #007bff;
        font-weight: bold;
        }
        .lang-separator {
        color: #ccc;
        }
        main {
        padding-top: 30px;
        }
        hr {
        border: none;
        border-top: 1px solid #ccc;
        }
        .form-group {
        margin-bottom: 15px;
        position: relative;
        }
        .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        }
        input[type="text"],
        input[type="date"],
        select {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
        margin-top: 5px;
        border: 1px solid #ccc;
        }
        .form-row {
        display: flex;
        gap: 10px;
        }
        .form-row .form-group {
        flex: 1;
        }
        .optional-note {
        font-weight: normal;
        font-size: 0.8em;
        color: #666;
        display: block;
        }
        /* CRITICAL: FOUC Fix */
        body { visibility: hidden; opacity: 0; transition: opacity 0.5s; }
        body.ready { visibility: visible; opacity: 1; }
    </style>
    <script>
        const translations = {
            'en': {
                'page-title': 'Flight Booking (Simplified)',
                'sign-in-link': 'Sign In', 'create-account-link': 'Create Account', 'from-label': 'From', 'to-label': 'To', 'depart-date-label': 'Depart Date', 'return-date-label': 'Return Date', 'travelers-label': 'Travelers', 'class-label': 'Class', 'departure-placeholder': 'Departure city', 'arrival-placeholder': 'Arrival city', 'economy-option': 'Economy', 'business-option': 'Business', 'first-option': 'First', 'search-button': 'Search Flights',
            },
            'ru': {
                'page-title': 'Бронирование авиабилетов (упрощенное)',
                'sign-in-link': 'Войти', 'create-account-link': 'Создать аккаунт', 'from-label': 'Откуда', 'to-label': 'Куда', 'depart-date-label': 'Дата вылета', 'return-date-label': 'Дата возвращения', 'travelers-label': 'Пассажиры', 'class-label': 'Класс', 'departure-placeholder': 'Город отправления', 'arrival-placeholder': 'Город прибытия', 'economy-option': 'Эконом', 'business-option': 'Бизнес', 'first-option': 'Первый', 'search-button': 'Найти рейсы',
            }
        };

        const localStorageKey = 'userLanguagePreference';
        const formBaseAction = 'search-flights';

        // **NEW** Caching Key Prefix for localStorage
        const cacheKeyPrefix = 'airportCache_';

        let currentLang;

        function setContentLanguage(lang) {
            const t = translations[lang];

            const updateElement = (id, key, type = 'text') => {
                const el = document.getElementById(id);
                if (el && t[key]) {
                    if (type === 'placeholder') {
                        el.placeholder = t[key];
                    } else {
                        el.textContent = t[key];
                    }
                }
            };

            document.title = t['page-title'] || 'AeroBook';
            updateElement('page-title', 'page-title');
        }

        function initializeLanguage() {
            const urlLangMatch = window.location.pathname.match(/^\/(\w{2})(?:$|\/)/);
            let urlLang = urlLangMatch ? urlLangMatch[1] : null;

            // 1. URL Path check (Highest priority)
            if (urlLang && translations[urlLang]) {
                return urlLang;
            }

            // 2. Check localStorage
            let savedLang = localStorage.getItem(localStorageKey);
            if (savedLang && translations[savedLang]) {
                return savedLang;
            }

            // 3. Default
            return 'en';
        }

        currentLang = initializeLanguage();
        setContentLanguage(currentLang);

        // Ensure the URL path reflects the determined language
        const pathLangMatch = window.location.pathname.match(/^\/(\w{2})(?:$|\/)/);
        if (!pathLangMatch || pathLangMatch[1] !== currentLang) {
             const newPath = `/${currentLang}/`;
             history.replaceState(null, '', newPath);
        }

    </script>
</head>
<body class="loading">
<div class="container">
    <header class="header">
        <h1 style="font-size: 1.5em; margin: 0;" id="app-title">AeroBook</h1>
        <nav class="auth-buttons">
            <a href="#signin" id="sign-in-link">Sign In</a>
            <a href="#signup" id="create-account-link">Create Account</a>
        </nav>
    </header>
    <hr>
    <main>
        <form id="flight-form" action="" method="GET">
            <div class="form-row">
                <div class="form-group">
                    <label for="from" data-localize="from-label">From</label>
                    <input type="text" id="from" name="from" placeholder="Departure city" list="from-airports" required data-localize-placeholder="departure-placeholder">
                    <datalist id="from-airports"></datalist>
                </div>
                <div class="form-group">
                    <label for="to" data-localize="to-label">To</label>
                    <input type="text" id="to" name="to" placeholder="Arrival city" list="to-airports" required data-localize-placeholder="arrival-placeholder">
                    <datalist id="to-airports"></datalist>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="depart-date" data-localize="depart-date-label">Depart Date</label>
                    <input type="date" id="depart-date" name="depart" required>
                </div>
                <div class="form-group">
                    <label for="return-date" data-localize="return-date-label">
                        Return Date
                    </label>
                    <input type="date" id="return-date" name="return">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="passengers" data-localize="travelers-label">Travelers</label>
                    <select id="passengers" name="passengers">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="class" data-localize="class-label">Class</label>
                    <select id="class" name="class">
                        <option value="economy" data-localize="economy-option">Economy</option>
                        <option value="business" data-localize="business-option">Business</option>
                        <option value="first" data-localize="first-option">First</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <button type="submit" id="search-button"
                        style="width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; cursor: pointer;">
                    Search Flights
                </button>
            </div>
        </form>
    </main>
    <div id="language-select-container">
        <a href="#" class="lang-option" data-lang="en" id="lang-en">en</a>
        <span class="lang-separator">/</span>
        <a href="#" class="lang-option" data-lang="ru" id="lang-ru">ru</a>
    </div>
</div>
<script>
    // Note: currentLang, cacheKeyPrefix are globally defined in the HEAD script.

    function applyLocalization(lang) {
        const t = translations[lang];

        // Update content elements (omitted for brevity)
        document.getElementById('page-title').textContent = t['page-title'];
        document.getElementById('sign-in-link').textContent = t['sign-in-link'];
        document.getElementById('create-account-link').textContent = t['create-account-link'];
        document.getElementById('search-button').textContent = t['search-button'];

        document.querySelectorAll('[data-localize]').forEach(element => {
            const key = element.getAttribute('data-localize');
            if (t[key]) {
                element.textContent = t[key];
            }
        });
        document.querySelectorAll('[data-localize-placeholder]').forEach(element => {
            const key = element.getAttribute('data-localize-placeholder');
            if (t[key]) {
                element.placeholder = t[key];
            }
        });

        // Update class and passenger labels/options (omitted for brevity)
        document.getElementById('passengers').previousElementSibling.textContent = t['travelers-label'];
        document.getElementById('class').previousElementSibling.textContent = t['class-label'];
        document.querySelectorAll('#class option').forEach(option => {
            const key = option.getAttribute('data-localize');
            if (key && t[key]) {
                option.textContent = t[key];
            }
        });

        // Language Highlighting
        document.querySelectorAll('.lang-option').forEach(link => {
            link.classList.remove('active');
        });
        const activeLink = document.getElementById(`lang-${lang}`);
        if (activeLink) {
            activeLink.classList.add('active');
        }

        // Update Form Action
        const form = document.getElementById('flight-form');
        form.action = `/${lang}/${formBaseAction}`;
    }

    function changeLanguage(newLang) {
        if (currentLang === newLang) return;

        currentLang = newLang;

        // 1. Save preference to localStorage
        localStorage.setItem(localStorageKey, newLang);

        // 2. Apply ALL localization changes (This updates form.action)
        applyLocalization(currentLang);

        // 3. Update URL (for navigation/sharing)
        const newPath = `/${currentLang}/`;
        history.pushState(null, '', newPath);
    }

    // Function to update the Datalist with fetched/cached data
    function updateDatalist(datalistId, airports) {
        const datalist = document.getElementById(datalistId);
        datalist.innerHTML = '';
        if (Array.isArray(airports)) {
            airports.forEach(airport => {
                const option = document.createElement('option');
                const value = `${airport.name} (${airport.code}) - ${airport.city}`;
                option.value = value;
                datalist.appendChild(option);
            });
        }
    }

    // **MODIFIED** searchAirport to include caching logic
    async function searchAirport(inputElement, datalistId) {
        const airportQuery = inputElement.value.trim();
        const cacheKey = cacheKeyPrefix + airportQuery;

        if (airportQuery.length < 3) {
            document.getElementById(datalistId).innerHTML = '';
            return;
        }

        const apiEndpoint = `airports/lookup/v1?airport=${encodeURIComponent(airportQuery)}`;
        const headers = {};

        // 1. Check for cached headers and data
        const cachedData = localStorage.getItem(cacheKey);
        let cachedHeaders = {};

        if (cachedData) {
            try {
                const cache = JSON.parse(cachedData);
                cachedHeaders = cache.headers || {};

                // Add conditional request headers
                if (cachedHeaders.etag) {
                    headers['If-None-Match'] = cachedHeaders.etag;
                }
                if (cachedHeaders.lastModified) {
                    headers['If-Modified-Since'] = cachedHeaders.lastModified;
                }

                // Use cached data immediately if we have it,
                // in case the server returns 304 (Not Modified)
                updateDatalist(datalistId, cache.airports);
            } catch (e) {
                console.error("Error parsing cached data:", e);
                localStorage.removeItem(cacheKey);
            }
        }

        // 2. Make the fetch request with conditional headers
        try {
            const response = await fetch(apiEndpoint, { headers });

            // 3. Handle 304 Not Modified
            if (response.status === 304) {
                // Data hasn't changed, already displayed cached results from step 1
                return;
            }

            if (!response.ok) {
                console.error('API request failed:', response.statusText);
                return;
            }

            // 4. Handle 200 OK (New Data)
            const airports = await response.json();
            updateDatalist(datalistId, airports); // Update datalist with new data

            // 5. Save new cache headers and data
            const newEtag = response.headers.get('ETag');
            const newLastModified = response.headers.get('Last-Modified');

            const newCache = {
                airports: airports,
                headers: {}
            };

            if (newEtag) {
                newCache.headers.etag = newEtag;
            }
            if (newLastModified) {
                newCache.headers.lastModified = newLastModified;
            }

            localStorage.setItem(cacheKey, JSON.stringify(newCache));

        } catch (error) {
            console.error('Error fetching airport data:', error);
        }
    }

    // --- Final Step: Run full localization and reveal body ---

    // Attach to DOMContentLoaded to guarantee all elements are available
    document.addEventListener('DOMContentLoaded', () => {
        // 1. Apply full localization and highlight the correct link (This updates form.action)
        applyLocalization(currentLang);

        // 2. Attach Event Listeners
        const langOptions = document.querySelectorAll('.lang-option');
        const fromInput = document.getElementById('from');
        const toInput = document.getElementById('to');

        langOptions.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                changeLanguage(e.target.dataset.lang);
            });
        });

        fromInput.addEventListener('input', () => {
            searchAirport(fromInput, 'from-airports');
        });

        toInput.addEventListener('input', () => {
            searchAirport(toInput, 'to-airports');
        });

        // 3. Reveal the body
        document.body.classList.add('ready');
    });

</script>
</body>
</html>
